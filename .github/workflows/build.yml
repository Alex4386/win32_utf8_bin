name: Build

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v1.1
    - name: Build the DLL
      run: |
        $platform = "${{ matrix.platform }}"
        if ($platform -eq "x86") {
          $platform = "Win32"
        }
        msbuild win32_utf8/win32_utf8.vcxproj /p:Configuration="Release Dynamic" /p:Platform=$platform /p:PlatformToolset=v143
    - name: Upload artifact (MSVC ${{ matrix.platform }})
      uses: actions/upload-artifact@v4
      with:
        name: win32_utf8_dll_msvc_${{ matrix.platform }}
        path: win32_utf8/bin/win32_utf8_*.dll

  build-mingw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install MinGW-w64
      run: sudo apt-get update && sudo apt-get install -y mingw-w64
    - name: Build the DLL (MinGW ${{ matrix.arch }})
      run: ./build-dll.sh ${{ matrix.arch }}
    - name: Upload artifact (MinGW ${{ matrix.arch }})
      uses: actions/upload-artifact@v4
      with:
        name: win32_utf8_dll_mingw_${{ matrix.arch }}
        path: win32_utf8.${{ matrix.arch }}.dll
